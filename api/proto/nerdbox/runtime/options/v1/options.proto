syntax = "proto3";

package containerd.nerdbox.runtime.options.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/containerd/nerdbox/api/runtime/options/v1;options";

// Options carries per-sandbox runtime configuration for the nerdbox shim,
// set via the container/sandbox's runtime options (containerd's
// WithRuntime) and threaded down to the shim manager's Start through
// BootstrapParams.Extensions (see pkg/shim/manager and pkg/shim/watchdog).
message Options {
	// disable_watchdog turns off the Windows shutdown watchdog
	// (pkg/shim/watchdog) for this sandbox's shim. Unset (false) leaves it
	// enabled, which is the default.
	bool disable_watchdog = 1;

	// watchdog_timeout overrides watchdog.Timeout for this sandbox's shim:
	// how long the watchdog waits, once armed by manager.Stop, before
	// concluding the process is unrecoverably wedged and terminating it.
	// Unset (zero) keeps the package default. Ignored if disable_watchdog
	// is true.
	google.protobuf.Duration watchdog_timeout = 2;
}
